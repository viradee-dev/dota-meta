<style>
:root { color-scheme: dark; --bg: #12171f; --panel: #1a212c; --line: #303b4b; --fg: #e9edf2; --muted: #98a4b4; --gold: #e0ad4f; --bad: #ee7a6d; }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--fg); font: 15px/1.45 "Segoe UI", Arial, sans-serif; display: grid; place-items: center; padding-block: 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
form { width: 100%; max-width: 340px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 20px; display: grid; gap: 12px; }
h1 { margin: 0; font-size: 24px; }
p { margin: 0; color: var(--muted); font-size: 14px; }
input, button { font: inherit; border-radius: 6px; padding: 9px 12px; width: 100%; }
input { background: var(--bg); color: var(--fg); border: 1px solid var(--line); }
button { background: var(--gold); color: #1b1407; border: 1px solid var(--gold); font-weight: 600; cursor: pointer; }
button:disabled { opacity: .6; cursor: default; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
#msg { color: var(--bad); min-height: 21px; font-size: 14px; }
[hidden] { display: none !important; }
</style>

const KEY = 'd2.access';
const bytes = b64 => Uint8Array.from(atob(b64), c => c.charCodeAt(0));
const toB64 = u => btoa(String.fromCharCode(...u));
const subtle = crypto.subtle;

async function derive(password) {
  const base = await subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveBits']);
  const bits = await subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: bytes(P.salt), iterations: P.iter }, base, 512);
  return new Uint8Array(bits);
}

async function unlock(keyBytes) {
  const iv = bytes(P.iv), ct = bytes(P.ct);
  const signed = new Uint8Array(iv.length + ct.length);
  signed.set(iv); signed.set(ct, iv.length);
  const mac = await subtle.importKey('raw', keyBytes.slice(32), { name: 'HMAC', hash: 'SHA-256' }, false, ['verify']);
  if (!await subtle.verify('HMAC', mac, bytes(P.mac), signed)) return false;
  const aes = await subtle.importKey('raw', keyBytes.slice(0, 32), 'AES-CBC', false, ['decrypt']);
  const html = new TextDecoder().decode(await subtle.decrypt({ name: 'AES-CBC', iv }, aes, ct));
  try { localStorage.setItem(KEY, toB64(keyBytes)); } catch { /* запоминание необязательно */ }
  document.open();
  document.write(html);
  document.close();
  return true;
}

let saved = null;
try { saved = localStorage.getItem(KEY); } catch { /* вход только по паролю */ }
if (saved) {
  const form = document.getElementById('gate');
  form.hidden = true;
  // document.open срабатывает только после того, как браузер дочитал эту страницу.
  window.addEventListener('load', async () => {
    try { if (await unlock(bytes(saved))) return; } catch { /* покажем форму */ }
    try { localStorage.removeItem(KEY); } catch { /* ничего */ }
    form.hidden = false;
  });
}

document.getElementById('gate').addEventListener('submit', async ev => {
  ev.preventDefault();
  const go = document.getElementById('go'), msg = document.getElementById('msg');
  go.disabled = true;
  msg.textContent = '';
  try {
    if (!await unlock(await derive(document.getElementById('password').value))) msg.textContent = 'Неверный пароль.';
  } catch {
    msg.textContent = 'Браузер не смог открыть страницу. Попробуй другой браузер.';
  }
  go.disabled = false;
});
</script>
